[project]
name = "vibes"
version = "0.1.0"
description = "Lightweight, self-contained research tools sharing one Python env."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "paramiko",
    "pyyaml",
    "psutil",
    "requests",
]

[project.optional-dependencies]
# Opt-in deps for building Mac .app bundles of individual vibes.
# Install with: uv sync --extra macapp
macapp = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]

[tool.uv]
# uv-native lock lives in uv.lock. Run `uv sync` to install.
